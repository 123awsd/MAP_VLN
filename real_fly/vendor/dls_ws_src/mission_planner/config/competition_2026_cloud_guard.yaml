# Add virtual obstacle ceilings above A/B/C before the cloud reaches ROG-Map.
# X/Y use the takeoff-relative world frame; Z remains referenced to floor z=0.
# D is intentionally omitted so its upper-to-lower gate traversal is unaffected.
enabled: true
input_topic: "/cloud_registered"
output_topic: "/competition/planning_cloud"
constraint_topic: "/competition/static_constraint_cloud"
expected_frame: "world"
ceiling_z: 2.0
grid_resolution: 0.2
virtual_point_intensity: 0.0

# Parallel arrays, in order: A, B, C.
region_x_min: [-0.75, -0.75,  6.75]
region_x_max: [ 6.75,  6.75, 14.25]
region_y_min: [-6.25, -13.25, -13.25]
region_y_max: [ 0.75,  -6.25,  -6.25]
