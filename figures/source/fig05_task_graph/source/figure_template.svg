<text x="143.0" y="56.0" class="instruction">“First, check if the kettle is next to the stove in the kitchen. Then check if the water bottle on the bedroom desk is</text>
<text x="143.0" y="91.0" class="instruction">empty, if there is tissue next to the bathroom sink, and if the backpack is on the coffee table in the living room.</text>
<text x="143.0" y="126.0" class="instruction">Also check if the book is on the table in the living room. If it is not there, go to the bedroom and check the table.”</text>
