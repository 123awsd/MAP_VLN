services:
  falcon:
    # Keep files written to host bind mounts owned by the host user.
    # Override these defaults on machines whose UID/GID are not 1000.
    user: "${PRE_MAP_VLN_UID:-1000}:${PRE_MAP_VLN_GID:-1000}"
    build:
      context: .
      dockerfile: containers/falcon_noetic/Dockerfile
      network: host
    image: pre-map-vln/falcon-noetic:local
    working_dir: /workspace/falcon_ws
    volumes:
      - ./outputs:/workspace/shared/outputs
      - ./logs:/workspace/shared/logs
      - ./runtime/bridge:/workspace/shared/bridge
      - ./ros_ws/src/pre_map_bridge:/workspace/falcon_ws/src/pre_map_bridge:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./runtime/rviz.Xauthority:/tmp/pre-map-vln.Xauthority:ro
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/pre-map-vln.Xauthority
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      DISABLE_ROS1_EOL_WARNINGS: "1"
    stdin_open: true
    tty: true
    networks:
      - pre_map_vln

  occusg:
    # Keep files written to host bind mounts owned by the host user.
    # Override these defaults on machines whose UID/GID are not 1000.
    user: "${PRE_MAP_VLN_UID:-1000}:${PRE_MAP_VLN_GID:-1000}"
    build:
      context: .
      dockerfile: containers/occusg_humble/Dockerfile
      network: host
    image: pre-map-vln/occusg-humble:local
    working_dir: /workspace/occusg_ws
    volumes:
      - ./runtime/occusg:/workspace/shared/occusg
      - ./outputs:/workspace/shared/outputs
      - ./occusg_bridge:/workspace/bridge:ro
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
    stdin_open: true
    tty: true
    networks:
      - pre_map_vln

networks:
  pre_map_vln:
    name: pre_map_vln
